name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            10.0.x
            11.0.100-rc.3.26522.148
      - name: Restore locked dependencies
        run: dotnet restore Lokad.Bash.slnx --locked-mode
      - name: Build Release
        run: dotnet build Lokad.Bash.slnx -c Release --no-restore
      - name: Test both target frameworks
        run: dotnet test Lokad.Bash.slnx -c Release --no-build --no-restore --logger trx --results-directory TestResults
      - name: Pack NuGet artifacts
        run: dotnet pack src/Lokad.Bash/Lokad.Bash.csproj -c Release --no-build --no-restore
      - name: Verify installed package on both runtimes
        shell: pwsh
        run: ./scripts/Test-NuGetPackage.ps1 -PackagePath (Get-ChildItem artifacts/nuget/Lokad.Bash.*.nupkg).FullName
      - name: Verify benchmark correctness without timings
        shell: pwsh
        run: |
          dotnet run --project benchmarks/Lokad.Bash.Benchmarks -c Release -f net11.0 --no-build --no-restore -- prepare artifacts/benchmarks/prepared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project benchmarks/Lokad.Bash.Benchmarks -c Release -f net11.0 --no-build --no-restore -- verify-managed artifacts/benchmarks/prepared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project benchmarks/Lokad.Bash.Benchmarks -c Release -f net10.0 --no-build --no-restore -- verify-managed artifacts/benchmarks/prepared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project benchmarks/Lokad.Bash.Benchmarks -c Release -f net11.0 --no-build --no-restore -- smoke artifacts/benchmarks/prepared arithmetic-branch-64 prepared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: ignore
      - name: Upload packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/nuget/
          if-no-files-found: error
      - name: Upload installed-package evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package-validation-${{ matrix.os }}
          path: |
            artifacts/package-validation/**/results.json
            artifacts/package-validation/**/net*.log
          if-no-files-found: ignore
      - name: Upload benchmark correctness evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: benchmark-correctness-${{ matrix.os }}
          path: |
            artifacts/benchmarks/prepared/catalog.json
            artifacts/benchmarks/prepared/*verification.json
            artifacts/benchmarks/prepared/smoke-*.json
          if-no-files-found: ignore
