name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            10.0.x
            11.0.100-rc.3.26522.148
      - name: Restore locked dependencies
        run: dotnet restore Lokad.Bash.slnx --locked-mode
      - name: Build Release
        run: dotnet build Lokad.Bash.slnx -c Release --no-restore
      - name: Test both target frameworks
        run: dotnet test Lokad.Bash.slnx -c Release --no-build --no-restore --logger trx --results-directory TestResults
      - name: Pack development artifacts
        run: dotnet pack src/Lokad.Bash/Lokad.Bash.csproj -c Release --no-build --no-restore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: ignore
      - name: Upload packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/nuget/
          if-no-files-found: error
